name: Supabase keep-alive

# Les projets Supabase gratuits sont mis en pause après 7 jours sans activité.
# Une requête REST légère par jour suffit à les garder éveillés. Les clés ci-dessous
# sont des clés PUBLIQUES (publishable) — protégées par le RLS, sans danger ici.
# Le job échoue (→ e-mail GitHub) si un projet de PRODUCTION ne répond pas.
on:
  schedule:
    - cron: '23 6 * * *'      # tous les jours à 06:23 UTC
  workflow_dispatch:

# Sécurité : le jeton GitHub ne peut que lire le dépôt
permissions:
  contents: read

jobs:
  ping:
    name: Ping des projets Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Oplaa (prod) · Restostock (prod) · Oplaa (test) · Chope (prod)
        run: |
          set -u
          ping() {  # url clé nom chemin-REST critique(1/0) — chemin = table (select id), rpc/<fonction>?params ou auth/v1/health
            case "$4" in rpc/*) q="$1/rest/v1/$4" ;; auth/*) q="$1/$4" ;; *) q="$1/rest/v1/$4?select=id&limit=1" ;; esac
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
              "$q" -H "apikey: $2" -H "Authorization: Bearer $2") || code=000
            if [ "$code" = "200" ]; then echo "✓ $3 → HTTP $code"
            elif [ "$5" = "1" ]; then echo "✗ $3 → HTTP $code (PRODUCTION)"; FAIL=1
            else echo "⚠ $3 → HTTP $code (projet de test, non bloquant)"; fi
            return 0
          }
          FAIL=0
          # Oplaa (prod) : depuis l'audit sécurité du 22/11, les tables sont fermées à anon (42501) → on ping la santé de l'auth.
          ping https://kldkqxqbmxtdedzjoghw.supabase.co sb_publishable_Ma29Syo4LkbtLLxIP4s9EA_8UIef3EL "Oplaa (prod)"       auth/v1/health 1
          ping https://iuzmerktgvgskhsojdha.supabase.co sb_publishable_7Hjw8Xk3E2dzUsPRAvPpkA_XYT-LIMt "Restostock (prod)"  companies      1
          ping https://rourjugjspqppjhrizxw.supabase.co sb_publishable_0YHzUC53GjuvekVfb8Azvg_Ze3fSUOF "Oplaa (test)"       establishments 0
          # Chope (org gratuite « Amui gratuit ») : tables fermées à anon, on appelle une RPC en lecture.
          ping https://kfgaskoexbuncpqffnrw.supabase.co sb_publishable_XAt_6HrEQGnW7DL9UjmNpw_0IfYI1Pn "Chope (prod)"       "rpc/my_groups?p_device=00000000-0000-0000-0000-000000000000" 1
          if [ "$FAIL" = "1" ]; then echo "::error::Un projet de PRODUCTION ne répond pas — vérifier sur supabase.com (en pause ?)"; exit 1; fi
